<!-- contact.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們 | HKDSE 數學</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">HKDSE 數學<span class="tech-glow">⚡</span></div>
    <nav>
      <a href="index.html">首頁</a>
      <a href="products.html">產品介紹</a>
      <a href="contact.html" class="active">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <h1 class="tech-title">聯絡<span class="glow-text">我們</span></h1>
      <p class="subtitle">任何問題，我們樂意協助</p>
    </section>

    <section class="contact-section">
      <div class="contact-info">
        <div class="info-item">
          <span class="info-icon">📧</span>
          <p>support@hkdse-math.tech</p>
        </div>
        <div class="info-item">
          <span class="info-icon">📱</span>
          <p>+852 1234 5678</p>
        </div>
        <div class="info-item">
          <span class="info-icon">📍</span>
          <p>香港科技大學創新中心</p>
        </div>
      </div>

      <form id="contactForm" class="contact-form">
        <div class="form-group">
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
        </div>
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">訊息</label>
          <textarea id="message" name="message" rows="5" placeholder="請輸入您的訊息..." required></textarea>
        </div>
        <button type="submit" class="cta-btn">發送訊息</button>
        <p id="formFeedback" class="form-feedback"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 HKDSE 數學 · 科技備戰平台</p>
  </footer>

  <!-- 優惠彈出視窗 (contact 頁面亦可使用) -->
  <div id="promoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>🎉 限時優惠</h2>
      <p>輸入優惠碼 <strong>TECH2025</strong> 即享首月 7 折！</p>
      <p class="small">優惠至 2025 年 12 月 31 日</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
